name: Purge Scheduled Account Deletions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: purge-scheduled-account-deletions
  cancel-in-progress: false

permissions: {}

jobs:
  purge:
    name: Trigger deletion purge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate scheduler configuration
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          DELETION_PURGE_SECRET: ${{ secrets.DELETION_PURGE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "::error::Repository variable APP_BASE_URL is not set."
            exit 1
          fi

          case "$APP_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::APP_BASE_URL must start with https://."
              exit 1
              ;;
          esac

          if [ -z "${DELETION_PURGE_SECRET:-}" ]; then
            echo "::error::Repository secret DELETION_PURGE_SECRET is not set."
            exit 1
          fi

      - name: Call protected purge endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          DELETION_PURGE_SECRET: ${{ secrets.DELETION_PURGE_SECRET }}
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            -X POST "${APP_BASE_URL%/}/api/internal/deletions/purge" \
            -H "Authorization: Bearer ${DELETION_PURGE_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}'
