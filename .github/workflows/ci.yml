name: CI

on:
  push:
    branches: [main, second-branch]
  pull_request:
    branches: [main, second-branch]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Audit, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Token compliance audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit and static tests
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/belttrack"
          DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/belttrack"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://example.com"
          SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key"
          VERIFICATION_CODE_SECRET: "ci-verification-code-secret-0123456789"
          COOKIE_SECRET: "ci-cookie-secret-0123456789"
          DELETION_PURGE_SECRET: "ci-deletion-purge-secret-0123456789"
          UPSTASH_REDIS_REST_URL: "https://ci.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "ci-upstash-token"
          SMTP_HOST: "smtp.example.com"
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: "ci@example.com"
          SMTP_PASS: "ci-smtp-password"
          SMTP_FROM: "BeltTrack CI <ci@example.com>"
        run: npm run build
